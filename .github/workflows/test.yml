name: tests

# alice is written in AQL and tracks aql MAIN (the aql:tui stack it needs
# postdates any tagged build), so CI builds the interpreter from source at
# main on every run. An upstream regression can therefore break CI
# independently of any change here — the accepted trade-off for riding the
# latest aql:tui (see README.md / dx-report.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out alice
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check out aql source (main)
        uses: actions/checkout@v4
        with:
          repository: aql-lang/aql
          ref: main
          path: aql-src

      - name: Build aql (main)
        run: |
          mkdir -p "$HOME/.local/bin"
          cd aql-src/cmd/go
          # A standalone clone (not the aql workspace) — GOFLAGS=-mod=mod is correct here.
          GOFLAGS=-mod=mod go build -o "$HOME/.local/bin/aql" ./aql
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aql" -version

      - name: Static check (launcher + modules)
        run: |
          for f in alice.aql alice-app.aql alice-fmt.aql alice-doc.aql \
                   alice-nav.aql alice-tabs.aql alice-view.aql; do
            echo "== check $f =="
            aql check "$f"
          done

      - name: Suites (interpreter)
        run: |
          for t in test/alice_*_test.aql; do
            echo "== $t =="
            aql "$t"
          done

      - name: Suites (bytecode — force-compile parity)
        run: |
          for t in test/alice_*_test.aql; do
            echo "== $t =="
            aql --force-compile "$t"
          done
