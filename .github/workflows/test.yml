name: tests

# aless is written in AQL and tracks aql MAIN (the aql:tui stack it needs
# postdates any tagged build), so CI builds the interpreter from source at
# main on every run. An upstream regression can therefore break CI
# independently of any change here — the accepted trade-off for riding the
# latest aql:tui (see README.md / dx-report.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so an upstream aql-main regression is caught even without a push.
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out aless
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check out aql source (main)
        uses: actions/checkout@v4
        with:
          repository: aql-lang/aql
          ref: main
          path: aql-src

      - name: Build aql (main)
        run: |
          mkdir -p "$HOME/.local/bin"
          cd aql-src/cmd/go
          # GOWORK=off: the aql repo ships a go.work, so disable workspace mode;
          # GOFLAGS=-mod=mod then builds the standalone clone.
          GOWORK=off GOFLAGS=-mod=mod go build -o "$HOME/.local/bin/aql" ./aql
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aql" -version

      - name: Static check (launcher + modules)
        run: |
          for f in aless.aql aless-app.aql aless-fmt.aql aless-doc.aql \
                   aless-nav.aql aless-tabs.aql aless-view.aql; do
            echo "== check $f =="
            aql check "$f"
          done

      - name: Suites (interpreter)
        run: |
          for t in test/aless_*_test.aql; do
            echo "== $t =="
            aql "$t"
          done

      - name: Suites (bytecode — force-compile parity)
        run: |
          for t in test/aless_*_test.aql; do
            echo "== $t =="
            aql --force-compile "$t"
          done
